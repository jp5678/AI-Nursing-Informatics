# 기본 브랜치(index)에 푸시될 때마다 GitHub Pages로 자동 배포
name: Deploy to GitHub Pages

on:
  push:
    branches: [index]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만 실행 (진행 중인 배포는 새 배포로 대체)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 저장소에 Pages가 아직 활성화되어 있지 않으면 자동 활성화
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # 정적 사이트(index.html, css, js, assets)를 저장소 루트째로 업로드
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
